services:
  # Unified Full-Stack Service (FastAPI + Embedded React PWA via Multi-Stage Docker)
  - type: web
    name: smriti-dementia-care
    env: docker
    dockerfilePath: ./Dockerfile
    region: singapore # Closest to North East India
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URL
        sync: false
        value: "mongodb://localhost:27017/smriti" # Falls back to in-memory mongomock if external MongoDB URI not supplied
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "10000"
